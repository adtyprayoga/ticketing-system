# Production stack for Coolify (Docker Compose build pack). See README.md.
# SERVICE_* variables are generated by Coolify; only the Midtrans keys need filling in.
# Local development uses compose.yaml instead.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ticketing
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d ticketing']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.3-alpine3.23
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/ticketing
      REDIS_URL: redis://redis:6379/0
      API_PORT: 4000
      # Better Auth cookies and the Snap return page belong to the public web URL.
      WEB_ORIGIN: ${SERVICE_URL_WEB}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      PAYMENT_PROVIDER: midtrans
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:?}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
  web:
    build:
      context: .
      target: web
    environment:
      - API_ORIGIN=http://api:4000
      # Coolify routes the web domain to port 3000; the API has no domain of its own.
      - SERVICE_FQDN_WEB_3000
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
